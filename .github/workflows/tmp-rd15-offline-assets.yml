name: Temporary RD15 Offline Assets
on:
  push:
    branches:
      - tmp-rd15-assets-20260824
    paths-ignore:
      - .rd15-assets-run.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > .rd15-assets-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .rd15-assets-run.txt
          git commit -m 'ci: record temporary RD15 run [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Install host SquashFS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
      - name: Fetch, verify and package pinned assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work/ss work/v2root work/v2check
          cd work
          curl --fail --location --retry 5 --retry-all-errors -o v2ray.zip 'https://github.com/v2fly/v2ray-core/releases/download/v5.52.0/v2ray-linux-arm32-v7a.zip'
          echo '569e84b2ec3a461da30329dbbd46311bdeb0da0079a85552d819877850552fe5  v2ray.zip' | sha256sum -c -
          unzip -q v2ray.zip -d v2
          test -f v2/v2ray
          echo '2eebcc2f3d7489a6a8253f928ddebfc8f0ffed7c645df3f8ef03c1d15c7f4f8e  v2/v2ray' | sha256sum -c -
          file v2/v2ray | tee ../out/V2RAY-ELF.txt
          readelf -h v2/v2ray | tee -a ../out/V2RAY-ELF.txt
          grep -q 'ELF 32-bit' ../out/V2RAY-ELF.txt
          grep -q 'ARM' ../out/V2RAY-ELF.txt
          grep -q 'statically linked' ../out/V2RAY-ELF.txt
          install -m 0755 v2/v2ray v2root/v2ray
          mksquashfs v2root ../out/v2ray-core.squashfs -comp xz -b 1048576 -noappend -no-xattrs -all-root -no-progress -mkfs-time 0 -all-time 0
          unsquashfs -no-progress -d v2check ../out/v2ray-core.squashfs >/dev/null
          echo '2eebcc2f3d7489a6a8253f928ddebfc8f0ffed7c645df3f8ef03c1d15c7f4f8e  v2check/v2ray' | sha256sum -c -
          sha256sum ../out/v2ray-core.squashfs > ../out/V2RAY-SQUASHFS.sha256

          BASE='https://downloads.openwrt.org/releases/21.02.2/packages/arm_cortex-a7_neon-vfpv4/packages'
          fetch_ipk() { n="$1"; s="$2"; curl --fail --location --retry 5 --retry-all-errors -o "ss/$n" "$BASE/$n"; echo "$s  ss/$n" | sha256sum -c -; cp "ss/$n" ../out/; }
          fetch_ipk 'shadowsocks-libev-config_3.3.5-1_arm_cortex-a7_neon-vfpv4.ipk' 'c730a2a46fde9773a7a60d0b7f5c15b90d79987fc1504b715d4a04dcf5f9c83a'
          fetch_ipk 'shadowsocks-libev-ss-local_3.3.5-1_arm_cortex-a7_neon-vfpv4.ipk' 'ff0fbb2ac21e8d68924d21a953a6210abc168fac503e54c8185919666b7ecf14'
          fetch_ipk 'shadowsocks-libev-ss-redir_3.3.5-1_arm_cortex-a7_neon-vfpv4.ipk' '56fb6414695d82af5f718a485b720c250eec8f6a77d93cc4356217bf47b430e3'
          fetch_ipk 'shadowsocks-libev-ss-server_3.3.5-1_arm_cortex-a7_neon-vfpv4.ipk' '4ed79e34980fdef7e3d26326888cbefbad9637cbb0aaa0e3e0b222064cb83ddb'
          cd ../out
          : > SS-ELF.txt
          unpack_ipk() {
            local f="$1" d="$2" data=''
            mkdir -p "$d/pkg" "$d/root"
            if ar t "$f" >/dev/null 2>&1; then (cd "$d/pkg" && ar x "../../$f"); else tar -xzf "$f" -C "$d/pkg"; fi
            for cand in "$d/pkg"/data.tar.gz "$d/pkg"/data.tar.xz "$d/pkg"/data.tar.zst "$d/pkg"/data.tar; do [ -f "$cand" ] && data="$cand" && break; done
            [ -n "$data" ] || { echo "No data.tar payload in $f" >&2; exit 1; }
            case "$data" in *.gz) tar -xzf "$data" -C "$d/root";; *.xz) tar -xJf "$data" -C "$d/root";; *.zst) tar --zstd -xf "$data" -C "$d/root";; *) tar -xf "$data" -C "$d/root";; esac
          }
          for f in shadowsocks-libev-ss-*.ipk; do
            d="inspect-${f%.ipk}"; unpack_ipk "$f" "$d"; found=0
            for b in "$d"/root/usr/bin/ss-*; do
              [ -f "$b" ] || continue; found=1
              file "$b" | tee -a SS-ELF.txt
              readelf -h "$b" | grep -E 'Class:|Machine:|Flags:' | tee -a SS-ELF.txt
              readelf -d "$b" 2>/dev/null | grep NEEDED | tee -a SS-ELF.txt || true
            done
            [ "$found" -eq 1 ] || { echo "No ss-* binary in $f" >&2; exit 1; }
          done
          grep -q 'ELF 32-bit' SS-ELF.txt
          grep -q 'ARM' SS-ELF.txt
          rm -rf inspect-*
          sha256sum v2ray-core.squashfs shadowsocks-libev-*.ipk > ASSETS.READY
          printf '%s\n' 'V2Ray v5.52.0 official linux arm32-v7a; release ZIP SHA256 569e84b2ec3a461da30329dbbd46311bdeb0da0079a85552d819877850552fe5; binary SHA256 2eebcc2f3d7489a6a8253f928ddebfc8f0ffed7c645df3f8ef03c1d15c7f4f8e.' 'V2Ray is stored in an XZ-compressed read-only SquashFS intended for a dedicated UBI static volume.' 'Shadowsocks-libev 3.3.5-1 is from the official OpenWrt 21.02.2 arm_cortex-a7_neon-vfpv4 repository; each IPK is pinned by SHA256.' > PROVENANCE.txt
      - name: Upload verified offline assets
        uses: actions/upload-artifact@v4
        with:
          name: rd15-offline-assets
          path: out/
          if-no-files-found: error
          retention-days: 7
